- type: entity
  id: WeaponEmplacementCombine
  name: combine emplacement
  description: A portable Combine pulse emplacement. Sit down to man the gun.
  parent: [BaseVehicleStrap, BaseDeployFoldable, BaseItem]
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Weapons/emplacement.rsi
    noRot: false
    drawdepth: Mobs
    layers:
    - state: combine_emplacement
      map: ["unfoldedLayer"]
    - state: combine
      map: ["foldedLayer"]
      visible: false
  - type: Item
    size: Ginormous
  - type: Appearance
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 360
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer
  - type: Vehicle
    canAttack: true
    transferDamage: false
  - type: GrosseEmplacement
    maxYawDeviation: 22.5
    damageSplit: 0.5
  - type: Strap
    buckleOffset: "0, 0.6"
    position: Stand
    modifyBuckleDrawDepth: false
  - type: MouseRotator
    angleTolerance: 5
    rotationSpeed: 180
    simple4DirMode: false
  - type: CombatMode
    toggleMouseRotator: false
  - type: NoRotateOnInteract
  - type: NoRotateOnMove
  - type: Gun
    cameraRecoilScalar: 5
    minAngle: 24
    maxAngle: 45
    fireRate: 8
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundEmpty: /Audio/_Grosse/Weapons/Ranged/ar2_empty.ogg
    soundGunshot:
      path: /Audio/_Grosse/Weapons/Ranged/ar2_fire.ogg
  - type: AmmoCounter
  - type: MagazineAmmoProvider
    autoEject: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePulseRifleC17
        insertSound: /Audio/_Grosse/Weapons/Ranged/ar2_reload.ogg
        ejectSound: /Audio/_Grosse/Weapons/Ranged/divet_magout.ogg
        whitelist:
          tags:
            - MagazinePulseRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 5

- type: entity
  parent: WeaponEmplacementCombine
  id: WeaponEmplacementCombineFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false
