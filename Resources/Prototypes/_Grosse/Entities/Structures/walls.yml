- type: entity
  id: BaseStrongWall
  suffix: Strong
  abstract: true
  components:
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:DoActsBehavior
        acts: ["Destruction"]

