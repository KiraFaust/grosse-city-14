- type: entity
  parent: BaseItem
  id: IronIngotMaterial
  name: слиток
  description: Железный слиток, вроде на вид обычный слиток, только структура у него странная, сам по себе он не особо горячий, вот только принимает форму совершенно легко, а самое главное, что после принятия формы, он застывает, лучше лишний раз его не трогать. Неправильный слиток.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/misc/material.rsi
    layers:
    - state: ironingot
  - type: Item
    size: Large
    shape:
    - 0,0,1,1
  - type: Tag
    tags:
    - ingotPiece
  - type: WhitelistTriggerCondition
    userWhitelist:
      tags:
      - FabricatorFlatter
  - type: TriggerOnCollide
    fixtureID: fix1
    ignoreOtherNonHard: false
  - type: SpawnOnTrigger
    proto: RoundIronIngotMaterial
  - type: DeleteOnTrigger

