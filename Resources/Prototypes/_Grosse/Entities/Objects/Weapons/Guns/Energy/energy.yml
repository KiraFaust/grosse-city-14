- type: entity
  name: BaseWeaponRifle
  parent: BaseItem
  id: BaseWeaponEnergyRifle
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 1
        whitelist:
          tags:
            - MagazineLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: StaticPrice
    price: 5500
  - type: Appearance
  - type: Wieldable
  - type: MagazineAmmoProvider
    autoEject: true
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true

- type: entity
  name: AR 2
  parent: BaseWeaponEnergyRifle
  id: WeaponPulseRifleAR2C17
  description: Импульсная винтовка Альянса, созданная из черной стали и использущая темную энергию, состаит в стандартном снаряжении сверх-человеческого отделения патруля Альянса и подразделения бионической пехоты Альянса.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/weapon/ar2/big.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Grosse/rsi/hlstaff/weapon/ar2/tiny.rsi
    size: Large
  - type: Clothing
    sprite: _Grosse/rsi/hlstaff/weapon/ar2/tiny.rsi
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -44
  - type: Gun
    minAngle: 24
    maxAngle: 45
    fireRate: 8
    soundEmpty: /_Grosse/audio/blackmesa/hl2/weapon/ar2_empty.ogg
    soundGunshot:
      path: /_Grosse/audio/blackmesa/hl2/weapon/ar2_fire.ogg
  - type: MagazineAmmoProvider
    autoEject: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePulseRifleC17
        insertSound: /_Grosse/audio/blackmesa/hl2/weapon/ar2_reload.ogg
        ejectSound: /_Grosse/audio/Weapon/Magout/divet_magout.ogg
        priority: 1
        whitelist:
          tags:
            - MagazinePulseRifle
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
