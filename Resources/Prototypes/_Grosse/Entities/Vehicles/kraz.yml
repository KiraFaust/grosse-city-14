- type: entity
  id: VehicleKraz17
  name: КрАЗ
  description: Военный грузовик, который всё ещё заводится. Три места в кабине.
  suffix: Vehicle
  components:
  - type: Transform
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.9,-2.15,1.9,2.15"
        density: 2000
        restitution: 0
        hard: true
        mask:
        - MobMask
        - BulletImpassable
        layer:
        - MachineLayer
  - type: GravityAffected
  - type: GrosseCar
    entryDelay: 0.8
    occupantActions:
    - ActionGrosseCarExit
    engineForce: 4000
    brakeForce: 6000
    friction: 1.5
    maxForwardSpeed: 8
    maxReverseSpeed: 3
    steerRate: 2.2
    minSteerSpeed: 0.6
    minImpactSpeed: 4
    impactCooldown: 0.5
    impactRestitution: 0.3
    pushMultiplier: 1
    knockdownTime: 1.5
    grip: 4
    handbrakeGrip: 0.6
    handbrakeForce: 5000
    minDriftSpeed: 4
    driftSlipThreshold: 0.35
    driftDecal: GrosseCarSkid
    driftDecalSpacing: 0.35
    maxDriveDamage: 200
    occupantDamageMultiplier: 0.35
    driftSound:
      path: /Audio/_Grosse/Vehicles/tire_squeal.ogg
      params:
        loop: true
    hitDamage:
      types:
        Blunt: 15
    selfDamage:
      types:
        Blunt: 5
    wallDamage:
      types:
        Blunt: 12
    slots:
    - id: driver
      name: grosse-car-slot-driver
      containerId: car-driver
      isDriver: true
      visuals: Driver
    - id: passenger
      name: grosse-car-slot-passenger
      containerId: car-passenger
      visuals: Passenger1
    - id: passenger2
      name: grosse-car-slot-passenger2
      containerId: car-passenger2
      visuals: Passenger2
  - type: SkipMobMovement
  - type: InputMover
  - type: DoAfter
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: MovementSound
    sound:
      path: /Audio/_Grosse/Machines/hummer_vehicle_drive_mono.ogg
      params:
        loop: true
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 16
    energy: 4
    netsync: true
  - type: Repairable
    fuelCost: 25
    doAfterDelay: 4
    allowSelfRepair: false
  - type: Sprite
    sprite: _Grosse/rsi/Structures/Decoration/Transport/kraz.rsi
    noRot: false
    overrideDir: South
    enableOverrideDir: true
    drawdepth: OverMobs
    layers:
    - state: kraz1
      map: [ "enum.GrosseCarVisualLayers.Base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GrosseCarVisuals.Lights:
        enum.GrosseCarVisualLayers.Lights:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Handbrake:
        enum.GrosseCarVisualLayers.Handbrake:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Driver:
        enum.GrosseCarVisualLayers.Driver:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Passenger1:
        enum.GrosseCarVisualLayers.Passenger1:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Passenger2:
        enum.GrosseCarVisualLayers.Passenger2:
          True: { visible: true }
          False: { visible: false }
  - type: ContainerContainer
    containers:
      car-driver: !type:ContainerSlot
        showEnts: false
      car-passenger: !type:ContainerSlot
        showEnts: false
      car-passenger2: !type:ContainerSlot
        showEnts: false
  - type: ActionsContainer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - car-driver
        - car-passenger
        - car-passenger2
      - !type:DoActsBehavior
        acts: ["Destruction"]
