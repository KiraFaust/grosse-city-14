# construction

- type: constructionGraph
  id: UnfinishedManhack
  start: start
  graph:
    - node: start
      edges:
      - to: Manhack
        completed:
          - !type:SpawnPrototype
            prototype: ManhackConstructionInactiveC17
            amount: 1
          - !type:DeleteEntity
        steps:
          - tag: ManhackBlade
            name: лопасти мэнхека
            doAfter: 2
          - tool: Screwing
            doAfter: 5
    - node: Manhack

- type: constructionGraph
  id: UnfinishedDevice
  start: start
  graph:
    - node: start
      edges:
      - to: Device
        completed:
          - !type:SpawnPrototype
            prototype: UnfinishedMedkit
            amount: 1
          - !type:DeleteEntity
        steps:
          - tool: Welding
            doAfter: 5
      - to: Heal
        completed:
          - !type:SpawnPrototype
            prototype: AntlionGrubCoreJuice
            amount: 3
          - !type:DeleteEntity
        steps:
          - tag: GrubAntlion
            name: муравьиная личинка
            doAfter: 4
      - to: Black
        completed:
          - !type:SpawnPrototype
