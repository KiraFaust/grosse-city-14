#        - !type:HTNCompoundTask
#          task: FollowCompound
#    - tasks:
#        - !type:HTNCompoundTask
#          task: InnateRangedCombatCompound
#    - tasks:
#        - !type:HTNCompoundTask
#          task: IdleCompound

- type: htnCompound
  id: CombineSoldierCompound
  branches:
  - tasks:
      - !type:HTNCompoundTask
        task: RunAndGunCombatCompound
  - tasks:
      - !type:HTNCompoundTask
        task: FollowCompound
  - tasks:
      - !type:HTNCompoundTask
        task: InnateRangedCombatCompound
  - tasks:
      - !type:HTNCompoundTask
        task: IdleCompound

- type: htnCompound
  id: RunAndGunCombatCompound
  branches:
    # Pick target, then move into range and shoot them.
    - tasks:
            
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: FollowTarget
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: FollowCloseRange

        - !type:HTNPrimitiveTask
          operator: !type:JukeOperator
            jukeType: AdjacentTile

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

